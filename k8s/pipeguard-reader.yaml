apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeguard-reader
  namespace: pipeguard-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeguard-reader
  namespace: pipeguard-lab
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeguard-reader
  namespace: pipeguard-lab
subjects:
  - kind: ServiceAccount
    name: pipeguard-reader
    namespace: pipeguard-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeguard-reader
